name: Kurator Legal Kill - Build Pipeline

on:
  push:
    branches:
      - feature/legal-kill-ci-test

concurrency:
  group: build-kurator-legal-kill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-patch:
    name: Build Patch Stage
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      # Step 1: Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # ✅ Step 2: Set up Node.js v8 using official GitHub Action
      - name: Set up Node.js v8
        uses: actions/setup-node@v3
        with:
          node-version: 8
          check-latest: true

      # Step 3: Install npm dependencies
      - name: Install npm dependencies
        run: npm install

      # Step 4: Run build
      - name: Build project
        run: npm run build

      # Step 5: Package the output
      - name: Package code as ZIP
        run: zip -r package.zip . -x "*.git*"

      # Step 6: Upload the artifact
      - name: Upload artifact - package.zip
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: package.zip


# Triggering CI for kurator project
